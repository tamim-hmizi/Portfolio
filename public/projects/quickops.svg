<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t">
  <title id="t">QuickOps architecture: a Git repository is analyzed by an LLM, then deployed to a VM with Terraform and Ansible or to AKS with Kubernetes manifests, through Jenkins, and monitored with Prometheus and Grafana.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#eab308"/></marker>
    <style>
      .box{fill:#1f2937;stroke:#374151;stroke-width:2}
      .hl{stroke:#eab308}
      .h{font:700 24px "Segoe UI",Helvetica,Arial,sans-serif;fill:#fff}
      .s{font:400 17px "Segoe UI",Helvetica,Arial,sans-serif;fill:#d1d5db}
      .ln{stroke:#eab308;stroke-width:2.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="960" height="600" fill="#0b0f17"/>
  <text x="48" y="64" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#eab308">QUICKOPS · DEVOPS AS A SERVICE</text>

  <rect class="box" x="48" y="250" width="180" height="100" rx="14"/>
  <text class="h" x="138" y="292" text-anchor="middle">Git repo</text>
  <text class="s" x="138" y="320" text-anchor="middle">React UI · Express API</text>

  <rect class="box hl" x="290" y="250" width="200" height="100" rx="14"/>
  <text class="h" x="390" y="292" text-anchor="middle">LLM analysis</text>
  <text class="s" x="390" y="320" text-anchor="middle">FastAPI service</text>

  <rect class="box" x="560" y="120" width="352" height="110" rx="14"/>
  <text class="h" x="736" y="166" text-anchor="middle">VM deployment</text>
  <text class="s" x="736" y="196" text-anchor="middle">Terraform · Ansible · Docker Compose</text>

  <rect class="box" x="560" y="370" width="352" height="110" rx="14"/>
  <text class="h" x="736" y="416" text-anchor="middle">AKS deployment</text>
  <text class="s" x="736" y="446" text-anchor="middle">Kubernetes manifests · microservices</text>

  <rect class="box" x="290" y="470" width="200" height="90" rx="14"/>
  <text class="h" x="390" y="508" text-anchor="middle">Jenkins CI/CD</text>
  <text class="s" x="390" y="536" text-anchor="middle">SonarQube · Nexus</text>

  <rect class="box" x="560" y="250" width="352" height="80" rx="14"/>
  <text class="h" x="736" y="284" text-anchor="middle">Monitoring</text>
  <text class="s" x="736" y="312" text-anchor="middle">Prometheus · Grafana</text>

  <path class="ln" d="M228 300H286"/>
  <path class="ln" d="M490 280C530 260 530 190 556 178"/>
  <path class="ln" d="M490 320C530 340 530 410 556 422"/>
  <path class="ln" d="M390 350V466"/>
  <path class="ln" d="M736 230V246"/>
  <path class="ln" d="M736 370V334"/>
</svg>
